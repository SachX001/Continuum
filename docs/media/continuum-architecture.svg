<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Continuum engineering context transfer architecture</title>
  <desc id="desc">A left-to-right pipeline from Claude Desktop through UI Automation, extraction, artifact parsing, SQLite evidence, reviewed memory, retrieval, local Ollama compilation, validation, and a fresh AI session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 600 42px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #cbd5e1; }
      .node-title { font: 600 20px Arial, sans-serif; fill: #f8fafc; }
      .node-copy { font: 400 15px Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 500 14px Arial, sans-serif; fill: #bae6fd; letter-spacing: 1.5px; }
      .node { fill: #111c33; stroke: #334155; stroke-width: 2; }
      .evidence { fill: #102a43; stroke: #38bdf8; stroke-width: 2; }
      .memory { fill: #241b45; stroke: #a78bfa; stroke-width: 2; }
      .delivery { fill: #12352f; stroke: #34d399; stroke-width: 2; }
      .line { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .branch { stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="90" y="92" class="title">Continuum</text>
  <text x="90" y="130" class="subtitle">Evidence-first context transfer for engineering AI sessions</text>
  <text x="90" y="184" class="small">CAPTURE  →  PRESERVE  →  REVIEW  →  COMPILE  →  CONTINUE</text>

  <path class="line" d="M260 310 H330"/>
  <path class="line" d="M540 310 H610"/>
  <path class="line" d="M820 310 H890"/>
  <path class="line" d="M1100 310 H1170"/>
  <path class="line" d="M1380 310 H1450"/>

  <g filter="url(#shadow)">
    <rect class="node" x="70" y="235" width="190" height="150" rx="18"/>
    <rect class="node" x="350" y="235" width="190" height="150" rx="18"/>
    <rect class="evidence" x="630" y="235" width="190" height="150" rx="18"/>
    <rect class="evidence" x="910" y="235" width="190" height="150" rx="18"/>
    <rect class="memory" x="1190" y="235" width="190" height="150" rx="18"/>
    <rect class="delivery" x="1470" y="235" width="90" height="150" rx="18"/>
  </g>

  <text x="95" y="280" class="node-title">Claude Desktop</text>
  <text x="95" y="318" class="node-copy">Original engineering</text>
  <text x="95" y="342" class="node-copy">conversation</text>

  <text x="375" y="280" class="node-title">Windows UI</text>
  <text x="375" y="307" class="node-title">Automation</text>
  <text x="375" y="345" class="node-copy">Provider adapter</text>
  <text x="375" y="369" class="node-copy">with extraction checks</text>

  <text x="655" y="280" class="node-title">Conversation</text>
  <text x="655" y="307" class="node-title">Extraction</text>
  <text x="655" y="345" class="node-copy">Ordered messages</text>
  <text x="655" y="369" class="node-copy">raw evidence + diagnostics</text>

  <text x="935" y="280" class="node-title">Artifact Parsing</text>
  <text x="935" y="307" class="node-title">&amp; Provenance</text>
  <text x="935" y="345" class="node-copy">Exact code blocks</text>
  <text x="935" y="369" class="node-copy">revisions + source links</text>

  <text x="1215" y="280" class="node-title">SQLite Evidence</text>
  <text x="1215" y="307" class="node-title">Repository</text>
  <text x="1215" y="345" class="node-copy">FTS5 retrieval</text>
  <text x="1215" y="369" class="node-copy">migrations + backups</text>

  <text x="1488" y="280" class="node-title">Reviewed</text>
  <text x="1488" y="307" class="node-title">Memory</text>
  <text x="1488" y="345" class="node-copy">Current</text>
  <text x="1488" y="369" class="node-copy">state</text>

  <path class="line" d="M1560 460 V550 H1370"/>
  <path class="line" d="M1190 620 H1010"/>
  <path class="line" d="M830 620 H650"/>
  <path class="line" d="M470 620 H290"/>
  <path class="line" d="M110 620 V780 H260"/>

  <path class="branch" d="M1285 385 V480"/>
  <path class="branch" d="M1370 550 V480"/>

  <g filter="url(#shadow)">
    <rect class="memory" x="1180" y="480" width="190" height="140" rx="18"/>
    <rect class="node" x="920" y="550" width="190" height="140" rx="18"/>
    <rect class="node" x="660" y="550" width="170" height="140" rx="18"/>
    <rect class="node" x="400" y="550" width="170" height="140" rx="18"/>
    <rect class="delivery" x="140" y="550" width="170" height="140" rx="18"/>
    <rect class="delivery" x="260" y="780" width="230" height="120" rx="18"/>
  </g>

  <text x="1205" y="526" class="node-title">Context Retrieval</text>
  <text x="1205" y="563" class="node-copy">Task-relevant</text>
  <text x="1205" y="587" class="node-copy">current memory</text>

  <text x="945" y="596" class="node-title">Local Ollama</text>
  <text x="945" y="623" class="node-title">Compilation</text>
  <text x="945" y="661" class="node-copy">Compact semantic</text>
  <text x="945" y="683" class="node-copy">generation, offline</text>

  <text x="685" y="596" class="node-title">Validated</text>
  <text x="685" y="623" class="node-title">Package</text>
  <text x="685" y="661" class="node-copy">Schema checks</text>
  <text x="685" y="683" class="node-copy">exact artifacts restored</text>

  <text x="425" y="596" class="node-title">Memory Update</text>
  <text x="425" y="623" class="node-title">Prompt</text>
  <text x="425" y="661" class="node-copy">Markdown + JSON</text>
  <text x="425" y="683" class="node-copy">portable handoff</text>

  <text x="165" y="596" class="node-title">Fresh AI</text>
  <text x="165" y="623" class="node-title">Session</text>
  <text x="165" y="661" class="node-copy">Continue with</text>
  <text x="165" y="683" class="node-copy">correct revision</text>

  <text x="288" y="824" class="node-title">Review Gate</text>
  <text x="288" y="854" class="node-copy">Accept, reject, or supersede</text>
  <text x="288" y="878" class="node-copy">before memory becomes authoritative</text>

  <text x="90" y="944" class="small">EXACT SOURCE PRESERVATION  •  REVISION-AWARE MEMORY  •  LOCAL INFERENCE  •  TOKEN-EFFICIENT TRANSFER</text>
</svg>
